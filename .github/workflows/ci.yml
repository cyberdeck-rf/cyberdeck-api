name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format (informational — not blocking)
        # Le repo a 136 violations de fmt pré-existantes (auto-discovered).
        # On exécute le check pour visibilité mais on n'en fait pas un gate
        # tant qu'une PR de nettoyage `cargo fmt --all` n'a pas été mergée.
        run: cargo fmt --all -- --check || true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

      - name: Upload CLI + emu binaries
        uses: actions/upload-artifact@v4
        with:
          name: cyberdeck-api-linux
          path: |
            target/release/cyberdeck-emu
            target/release/cyberdeck-cli
          if-no-files-found: ignore

[package]
name         = "cyberdeck-api"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
description  = "Host-side library for the WraithRF / RF Cyberdeck firmware (USB CDC + JSON v1 protocol)."

[lib]
name = "cyberdeck_api"
path = "src/lib.rs"

# Le transport série (et `serialport` qui tire libudev sur Linux) est
# feature-gated pour permettre des consommateurs minces comme le binaire
# d'émulation `cyberdeck-emu` (TCP-only, dockerisé) qui n'ont pas besoin
# d'énumérer les ports série.  Le TCP transport est toujours dispo.
[features]
default = ["serial"]
serial  = ["dep:serialport", "dep:tokio-serial"]

[dependencies]
tokio        = { workspace = true }
tokio-util   = { workspace = true }
futures      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
tracing      = { workspace = true }
clap         = { workspace = true }

# Rules engine — HTTPS updater + intégrité.
# `ureq` blocking est wrappé dans `tokio::task::spawn_blocking` (M5).
# `sha2` calcule l'empreinte du pack pour détecter les changements vs cache.
# `tempfile` sert au write-then-rename atomique du cache pack local.
ureq         = { version = "2", features = ["json"] }
sha2         = "0.10"
tempfile     = "3"

# Rules engine — parsing du pack TOML + regex matcher.
toml         = "0.8"
regex        = "1"

# Optionnels (feature "serial")
serialport   = { workspace = true, optional = true }
tokio-serial = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
